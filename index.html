<style>
:root{
  --bg:#f6f2ea;--surface:#fffdf8;--ink:#231f1a;--muted:#6f675c;--line:#e2d9c8;
  --accent:#aa2b46;--accent-strong:#8a1f37;--accent-soft:#f7e3e7;
  --ok:#2f7a4a;--err:#b0362b;--radius:14px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1814;--surface:#24211c;--ink:#f1ece2;--muted:#a79f92;--line:#3a352d;
  --accent:#e0687f;--accent-strong:#f08598;--accent-soft:#3a2026;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{margin-bottom:20px;text-align:center}
.brand{background:#fff;border-radius:var(--radius);padding:14px 20px;border:1px solid var(--line);margin-bottom:14px}
.brand img{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.htext h1{color:var(--accent)}
h1{font-size:20px;margin:0;font-weight:700}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{appearance:none;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:14px 10px;font:inherit;font-weight:600;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;min-height:56px}
.type span{font-size:22px}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.type:focus-visible,input:focus-visible,textarea:focus-visible,.send:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
label.f input,label.f textarea{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#targa{text-transform:uppercase;letter-spacing:.06em}
textarea{resize:vertical;min-height:60px}
.photo{display:flex;gap:12px;align-items:center}
.photo label{flex:1;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-weight:600;color:var(--muted)}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
#preview{width:72px;height:72px;border-radius:10px;object-fit:cover;display:none;border:1px solid var(--line)}
#clearPhoto{display:none;background:none;border:0;color:var(--err);font:inherit;font-size:14px;cursor:pointer}
.send{width:100%;border:0;border-radius:var(--radius);background:var(--accent);color:#fff;font:inherit;font-size:20px;font-weight:700;padding:18px;cursor:pointer}
.send:hover{background:var(--accent-strong)}
.send:disabled{opacity:.6;cursor:wait}
#status{margin:12px 0 0;min-height:24px;font-weight:600;text-align:center}
#status.ok{color:var(--ok)}#status.err{color:var(--err)}
ul{list-style:none;margin:0;padding:0}
li{padding:8px 0;border-top:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:10px}
li:first-child{border-top:0}
li time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);font-size:15px}
</style>
</head>

    <div class="htext">
      <h1>Avviso al piano di carico</h1>
      <p>Portineria · il messaggio arriva solo a chi è iscritto al canale del piano di carico.</p>
    </div>
  </header>

  <form id="f" class="card" autocomplete="off">
    <p class="label">Tipo di avviso</p>
    <div class="types" role="group" aria-label="Tipo di avviso">
      <button type="button" class="type" data-t="Camion in arrivo" data-tag="truck" data-p="4" aria-pressed="true"><span>🚚</span>Camion in arrivo</button>
      <button type="button" class="type" data-t="Scarico merce" data-tag="package" data-p="3" aria-pressed="false"><span>📦</span>Scarico merce</button>
      <button type="button" class="type" data-t="Comunicazione di servizio" data-tag="loudspeaker" data-p="3" aria-pressed="false"><span>📢</span>Comunicazione di servizio</button>
      <button type="button" class="type" data-t="URGENTE" data-tag="rotating_light" data-p="5" aria-pressed="false"><span>🚨</span>Urgente</button>
    </div>
  </form>

  <div class="card">
    <div class="grid">
      <label class="f">Targa<input id="targa" maxlength="12" placeholder="AB123CD"></label>
      <label class="f">Ditta / Vettore<input id="ditta" maxlength="40" placeholder="Es. Rossi Trasporti"></label>
    </div>
    <label class="f">Note (facoltative)<textarea id="note" maxlength="300" placeholder="Es. baia 2, bancali farina"></textarea></label>
    <div class="photo">
      <label for="foto">📷 Aggiungi foto (bolla, camion…)</label>
      <input id="foto" type="file" accept="image/*" capture="environment">
      <img id="preview" alt="Anteprima foto">
    </div>
    <button type="button" id="clearPhoto">Rimuovi foto</button>
  </div>

  <button class="send" id="send">Invia avviso</button>
  <p id="status" role="status" aria-live="polite"></p>

  <div class="card">
    <p class="label">Ultimi avvisi inviati da qui</p>
    <ul id="log"></ul>
  </div>
</div>

<script>
// Nome del canale ntfy e configurazione
const TOPIC = "pastificio-carico-b2e49d94ff83";
const SERVER = "https://ntfy.sh";
const MAX_BYTES = 1.8 * 1024 * 1024; // Limite allegati ntfy.sh (2 MB)

// URL pubblico DIRETTO (https, .png/.jpg) del logo: ntfy lo scarica e lo mostra nella notifica.
// Esempio: "https://raw.githubusercontent.com/TUOUTENTE/TUOREPO/main/logo-ntfy.png"
// Se vuoto, la notifica parte senza icona.
const LOGO_URL = "https://raw.githubusercontent.com/vgiurata-rgb/logo/282eb3fde2229781794387fbf48910ec237627f2/logo-ntfy.png";

const $ = s => document.querySelector(s);
let type = document.querySelector('.type[aria-pressed="true"]');
let photoBlob = null;

document.querySelectorAll('.type').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.type').forEach(x => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); type = b;
}));

async function compress(file){
  const img = await createImageBitmap(file);
  let max = 1600, q = 0.75, blob;
  for (let i = 0; i < 6; i++){
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob.size <= MAX_BYTES) return blob;
    max *= 0.8; q -= 0.08;
  }
  return blob;
}

$('#foto').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  setStatus('Preparo la foto…');
  try {
    photoBlob = await compress(f);
    $('#preview').src = URL.createObjectURL(photoBlob);
    $('#preview').style.display = 'block'; $('#clearPhoto').style.display = 'inline';
    setStatus('');
  } catch { photoBlob = null; setStatus('Foto non leggibile, riprova.', 'err'); }
});

$('#clearPhoto').addEventListener('click', () => {
  photoBlob = null; $('#foto').value = '';
  $('#preview').style.display = 'none'; $('#clearPhoto').style.display = 'none';
});

function setStatus(t, cls=''){ const s=$('#status'); s.textContent=t; s.className=cls; }

$('#send').addEventListener('click', async () => {
  const targa = $('#targa').value.trim().toUpperCase();
  const ditta = $('#ditta').value.trim();
  const note = $('#note').value.trim();
  const title = type.dataset.t + (targa ? ' – ' + targa : '');
  const lines = [];
  if (ditta) lines.push('Ditta: ' + ditta);
  if (targa) lines.push('Targa: ' + targa);
  if (note) lines.push(note);
  const ora = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  lines.push('Ore ' + ora + ' – dalla portineria');
  const message = lines.join('\n');

  const p = new URLSearchParams({ 
    t: title, 
    m: message, 
    ta: type.dataset.tag, 
    p: type.dataset.p
  });
  // L'icona di ntfy richiede un URL pubblico (non un'immagine incorporata)
  if (LOGO_URL) p.set('icon', LOGO_URL);
  if (photoBlob) p.set('f', 'foto-' + Date.now() + '.jpg');

  $('#send').disabled = true; setStatus('Invio in corso…');
  try {
    const r = await fetch(SERVER + '/' + TOPIC + '?' + p.toString(), {
      method: photoBlob ? 'PUT' : 'POST',
      body: photoBlob || message
    });
    if (!r.ok) throw new Error(r.status);
    setStatus('✓ Avviso inviato al piano di carico', 'ok');
    addLog(ora, title);
    $('#targa').value = ''; $('#ditta').value = ''; $('#note').value = '';
    $('#clearPhoto').click();
  } catch (e) {
    setStatus('Invio non riuscito. Controlla la connessione e riprova.', 'err');
  } finally { $('#send').disabled = false; }
});

let sent = [];
function addLog(ora, title){
  sent.unshift({ ora, title });
  sent = sent.slice(0, 15);
  renderLog();
}

function renderLog(){
  const log = sent;
  $('#log').innerHTML = log.length
    ? log.map(x => `<li><span>${x.title.replace(/</g,'&lt;')}</span><time>${x.ora}</time></li>`).join('')
    : '<li class="empty">Nessun avviso inviato da quando hai aperto la pagina.</li>';
}

renderLog();
$('#f').addEventListener('submit', e => e.preventDefault());
</script>
</body>
